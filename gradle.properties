# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Minecraft / Java
minecraft_version=26.2
minecraft_version_range=[26.2]
java_version=25
gradle_version=9.5.1

# Fabric / Quilt
fabric_loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Forge
forge_version=65.1.3
forge_loader_version_range=[65,)
forge_eventbus_validator_version=7.0.5

# NeoForge
neoforge_version=26.2.0.87
moddevgradle_version=2.0.147

# Build tooling
shadow_version=9.6.1
mixin_compile_version=0.8.7

# Mod identity: metadata is generated from these values.
mod_id=examplemod
mod_name=Example Mod
mod_version=1.0.0
mod_description=A reusable Minecraft 26.2 universal-loader mod template.
mod_authors=YourName
mod_license=MIT
maven_group=com.example
base_package=com.example.examplemod
